<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบเบิก-จ่ายน้ำมันเชื้อเพลิง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="jsQR.js"></script>
<script src="qrcode.js"></script>
<style>
:root{
  --bg:#f3f5f8; --card:#fff; --ink:#1b2430; --muted:#697586; --line:#e2e7ee; --soft:#f7f9fb;
  --primary:#1f4e79; --primary-2:#2b6cb0; --diesel:#1565c0; --benzin:#e65100; --fuel:#f59e0b;
  --ok:#2e7d32; --bad:#c62828; --warn:#b26a00; --purple:#6a1b9a; --radius:14px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Sarabun',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.3}
h2{font-size:1.2rem}
h3{font-size:1.02rem}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.hidden{display:none!important}

/* ---------- header / nav ---------- */
.topbar{background:var(--primary);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.topbar-inner{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.15);display:grid;place-items:center;flex:none}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:.8rem;opacity:.8}
.userchip{display:flex;align-items:center;gap:8px;font-size:.85rem;background:rgba(255,255,255,.12);padding:4px 6px 4px 12px;border-radius:999px}
.userchip button{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:999px;padding:3px 10px;cursor:pointer}
.tabs{max-width:1100px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;color:rgba(255,255,255,.75);padding:10px 12px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
.tab.active{color:#fff;border-bottom-color:#ffc857}
.tab .cnt{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:#ffc857;color:#3b2a00;font-size:.75rem;font-weight:700}
.demo-bar{background:#fff4d6;color:#6b4d00;font-size:.85rem;text-align:center;padding:6px 12px}
.demo-bar button{border:1px solid #d9b45a;background:#fff;border-radius:8px;padding:1px 10px;margin-left:6px;cursor:pointer}

main{max-width:1100px;margin:0 auto;padding:16px 16px calc(104px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}

/* ---------- form ---------- */
label.f{display:block;font-size:.88rem;font-weight:600;margin-bottom:4px;color:#334155}
.input,select.input,textarea.input{width:100%;border:1px solid #cfd8e3;background:#fff;border-radius:10px;padding:10px 12px;outline:none;min-height:44px}
.input:focus{border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(43,108,176,.15)}
textarea.input{min-height:70px;resize:vertical}
.field{margin-bottom:14px}
.hint{font-size:.8rem;color:var(--muted);margin-top:3px}
.live{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;color:var(--ok);font-weight:600}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.linkbtn{background:none;border:0;color:var(--primary-2);cursor:pointer;padding:0;font-size:.8rem;text-decoration:underline}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px;background:#e8edf3;color:var(--ink);transition:filter .15s}
.btn:hover{filter:brightness(.96)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--primary);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:#fff;color:var(--bad);border-color:#f1b5b5}
.btn.orange{background:var(--benzin);color:#fff}
.btn.purple{background:var(--purple);color:#fff}
.btn.ghost{background:#fff;border-color:#cfd8e3}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.88rem;border-radius:8px}
.btn.block{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

.seg{display:inline-flex;background:#eef2f6;border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600;color:#475569}
.seg button.on{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* item cards */
.group-title{font-size:.82rem;font-weight:700;color:var(--muted);margin:10px 0 6px;text-transform:none}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.item{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;cursor:pointer;text-align:left;position:relative}
.item:hover{border-color:#b9c6d6}
.item.on{border-color:var(--primary-2);background:#eef5fd;box-shadow:0 0 0 3px rgba(43,108,176,.12)}
.item b{display:block;font-size:.95rem}
.item .plate{font-size:.85rem;color:#334155}
.item .tags{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;background:#eef2f6;color:#475569}
.tag.diesel{background:#e3effd;color:var(--diesel)}
.tag.benzin{background:#fff0e3;color:var(--benzin)}
.tag.pump{background:#e9f7ee;color:var(--ok)}
.tag.stock{background:#f3e8fb;color:var(--purple)}

/* status */
.st{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.st.PENDING{background:#fff4d6;color:#8a5a00}
.st.APPROVED{background:#e3effd;color:#1554a0}
.st.DISPENSED,.st.RECEIVED{background:#e6f4ea;color:#1e6b2a}
.st.REJECTED{background:#fdeaea;color:#a61b1b}

/* ---------- bottles ---------- */
.rack{display:flex;flex-wrap:wrap;gap:6px 4px;padding:12px;background:linear-gradient(#f8fafc,#eef2f6);border-radius:12px;border:1px solid var(--line)}
.tank{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 10px 10px;background:linear-gradient(#f8fafc,#eef2f6);border-radius:12px;border:1px solid var(--line)}
.tank svg{width:100%;max-width:240px;height:auto;display:block}
.tank .cap{font-size:.78rem;color:var(--muted);text-align:center;line-height:1.5}
.btl{width:40px;text-align:center;font-size:.66rem;color:#475569;line-height:1.15;position:relative}
.btl svg{width:34px;height:60px;display:block;margin:0 auto}
.btl .who{display:block;font-size:.62rem;color:var(--purple);max-width:44px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btl.sel svg{filter:drop-shadow(0 0 3px rgba(43,108,176,.9))}
.btl.pop svg{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.15)}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile b{font-size:1.6rem;display:block;line-height:1.1}
.tile span{font-size:.8rem;color:var(--muted)}
.liters{display:flex;gap:8px;flex-wrap:wrap}
.liters button{width:56px;height:52px;border-radius:12px;border:1.5px solid #cfd8e3;background:#fff;font-size:1.15rem;font-weight:700;cursor:pointer}
.liters button.on{background:var(--benzin);border-color:var(--benzin);color:#fff}
.liters button:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.alert{border-radius:10px;padding:10px 12px;font-size:.9rem;margin:10px 0}
.alert.bad{background:#fdeaea;color:#8f1a1a}
.alert.warn{background:#fff4d6;color:#6b4d00}
.alert.info{background:#e8f1fb;color:#1a4a7a}
.alert.ok{background:#e6f4ea;color:#1e5b28}

/* request cards */
.req{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#fff}
.req-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:8px}
.req-id{font-weight:700;color:var(--primary)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:3px 10px;font-size:.93rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.big{font-size:1.15rem;font-weight:700}
.stepper{display:inline-flex;align-items:center;border:1px solid #cfd8e3;border-radius:10px;overflow:hidden}
.stepper button{width:44px;height:44px;border:0;background:#eef2f6;font-size:1.3rem;cursor:pointer}
.stepper input{width:64px;text-align:center;border:0;height:44px;font-size:1.1rem;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;background:#f3e8fb;color:var(--purple);border-radius:999px;padding:3px 6px 3px 10px;font-weight:700;font-size:.85rem}
.chip button{border:0;background:rgba(0,0,0,.08);border-radius:50%;width:20px;height:20px;cursor:pointer;line-height:1}
.photo-prev{max-width:100%;max-height:220px;border-radius:10px;display:block;margin-top:8px}
.pick2{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}.pick2 .btn{flex:1 1 140px;display:inline-flex;align-items:center;justify-content:center;gap:6px;position:relative;cursor:pointer}.pick2 svg{width:18px;height:18px;flex:none}
.vh{position:absolute!important;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.subtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:26px 10px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.tbl{border-collapse:collapse;width:100%;font-size:.88rem;background:#fff}
.tbl th,.tbl td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
.tbl th{background:#f1f5f9;font-weight:700;color:#334155;position:sticky;top:0}
.tbl td.num,.tbl th.num{text-align:right}
.tbl input.input,.tbl select.input{min-height:34px;padding:4px 8px;border-radius:7px;min-width:80px}

/* modal / toast / loading */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:641px){.modal-bg{align-items:center;padding:16px}}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(74px + env(safe-area-inset-bottom))}
@media(min-width:641px){.modal{border-radius:18px}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-head button{border:0;background:#eef2f6;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:1.1rem}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;background:#1b2430;color:#fff;padding:10px 18px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:92vw;font-size:.92rem}
.toast.bad{background:var(--bad)} .toast.ok{background:var(--ok)}
.loading{position:fixed;inset:0;z-index:60;background:rgba(255,255,255,.55);display:grid;place-items:center}
.spin{width:42px;height:42px;border:4px solid #cbd5e1;border-top-color:var(--primary);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* scanner */
.scan-box{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3}
.scan-box video{width:100%;height:100%;object-fit:cover;display:block}
.scan-box .frame{position:absolute;inset:18% 22%;border:3px solid #ffc857;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scan-msg{margin:8px 0;font-weight:600;min-height:24px}

/* กล่องยิง QR (เปิดกล้องค้าง ยิงทีละขวด) */
.gun{position:relative;background:#0b0f14;border-radius:14px;overflow:hidden;aspect-ratio:4/3;max-height:52vh}
.gun video{width:100%;height:100%;object-fit:cover;display:block}
.gun .frame{position:absolute;inset:14% 16%;border:3px solid #ffc857;border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.34)}
.gun .gcount{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);color:#fff;font-weight:800;border-radius:999px;padding:5px 13px;font-size:1rem;letter-spacing:.5px}
.gun .gflash{position:absolute;inset:0;background:#22c55e;opacity:0;pointer-events:none;transition:opacity .12s}
.gun .gflash.on{opacity:.55;transition:none}
.gun .gflash.bad{background:#ef4444}
.gun .goff{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#cbd5e1;padding:20px;font-weight:600;background:#0b0f14}
.gun.camon .goff{display:none}
.gun-hit{font-size:1.15rem;font-weight:800;margin:10px 0 6px;min-height:28px}
.gun-hit.ok{color:var(--ok)} .gun-hit.bad{color:var(--bad)} .gun-hit.warn{color:#b45309}

/* LINE simulator (demo only) */
.linefab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:40;background:#06c755;color:#fff;border:0;border-radius:999px;padding:10px 16px;font-weight:700;box-shadow:0 6px 18px rgba(6,199,85,.4);cursor:pointer}
.linefab .cnt{background:#fff;color:#06c755;border-radius:999px;padding:0 7px;margin-left:6px}
.lmsg{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
.lmsg-h{padding:8px 12px;color:#fff;font-weight:700}
.lmsg-b{padding:8px 12px;font-size:.88rem}
.lmsg-to{font-size:.75rem;color:var(--muted);padding:4px 12px;background:var(--soft)}
.lmsg img{width:100%;display:block}

/* QR labels */
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.label{border:1.5px dashed #94a3b8;border-radius:10px;padding:8px;text-align:center;background:#fff}
.label .qr svg,.label .qr img{width:110px;height:110px}
.label b{display:block;font-size:1.3rem;letter-spacing:1px}
.label span{font-size:.7rem;color:var(--muted)}

/* print */
#printArea{display:none}
@media print{
  @page{size:A4 landscape;margin:12mm}
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;font-size:12px;color:#000}
  #printArea table{border-collapse:collapse;width:100%}
  #printArea th,#printArea td{border:1px solid #555;padding:4px 6px}
  #printArea th{background:#eee}
  #printArea .labels{grid-template-columns:repeat(4,1fr)}
  #printArea .label{break-inside:avoid}
  .pbreak{break-before:page}
}
@media screen{.tbl-wrap .rpt{min-width:960px;padding:10px}}
.rpt h1{font-size:18px;text-align:center;margin-bottom:2px}
.rpt .sub{text-align:center;margin-bottom:10px}
.rpt h3{margin:14px 0 6px;font-size:14px}
.rpt table{border-collapse:collapse;width:100%}
.rpt th,.rpt td{border:1px solid #9aa4b2;padding:4px 6px;font-size:12.5px}
.rpt th{background:#eef2f6}
.rpt .num{text-align:right}
.sign{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px;text-align:center}
.sign div{padding-top:34px}
</style>
<script src="config.js"></script>
</head>
<body data-page="" data-app="">

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 22V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v17"/><path d="M2 22h14"/><path d="M15 10h2a2 2 0 0 1 2 2v4a1.5 1.5 0 0 0 3 0V8l-3-3"/><rect x="6" y="6" width="6" height="5" rx="1"/></svg>
    </div>
    <div class="brand"><b>ระบบเบิก-จ่ายน้ำมันเชื้อเพลิง</b><span id="orgName">&nbsp;</span></div>
    <div id="userBox"></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<div id="demoBar" class="demo-bar hidden">โหมดสาธิต (ข้อมูลจำลอง ไม่บันทึกจริง)
  <button onclick="demoReset()">รีเซ็ตข้อมูล</button></div>

<main id="view"><div class="empty">กำลังโหลด...</div></main>

<div id="printArea"></div>
<div id="modalRoot"></div>
<div id="loading" class="loading hidden"><div class="spin"></div></div>
<button id="lineFab" class="linefab hidden" onclick="showLineLog()">LINE (จำลอง)<span class="cnt" id="lineCnt">0</span></button>
<input type="file" id="qrFile" accept="image/*" capture="environment" class="hidden">

<script>
/* =====================================================================
   CORE
   ===================================================================== */
const IS_GAS = !!(window.google && google.script && google.script.run);
const S = { boot: null, auth: null, me: null, page: 'request', form: null, live: true, liveTimer: null, adminTab: 'items', dispTab: 'wait' };
const STORE_KEY = 'fuel_auth_v1';
const TH_MONTH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const ROLE_LABEL = { requester:'ผู้ขอเบิก', approver_pump:'ผู้อนุมัติเติมที่ปั๊ม', approver_stock:'ผู้อนุมัติเบิกสต็อก', dispenser:'ผู้จ่ายสต็อก', admin:'ผู้ดูแลระบบ' };
const PAGES = [
  { id:'bottles',  label:'สต็อก / ขวดน้ำมัน',    roles:null },
  { id:'pump',     label:'อนุมัติเติมที่ปั๊ม',     roles:['approver_pump'] },
  { id:'stock',    label:'อนุมัติเบิกสต็อก',     roles:['approver_stock'] },
  { id:'dispense', label:'ผู้จ่ายสต็อก',          roles:['dispenser'] },
  { id:'report',   label:'รายงาน',              roles:['*'] },
  { id:'admin',    label:'ตั้งค่าระบบ',           roles:['admin'] }
];

const API_URL = (window.FUEL_API || '');   // ตั้งค่าใน config.js เมื่อโฮสต์หน้าเว็บนอก Apps Script (เช่น Netlify)
/** เรียก Apps Script ผ่าน fetch — บางครั้ง Google ตอบกลับเป็นหน้า HTML แทนข้อมูล (เกิดเป็นระยะ)
 *  จึงลองใหม่อัตโนมัติสูงสุด 4 ครั้ง โดยใช้รหัสคำสั่ง (op) เดิม ระบบจะไม่บันทึกซ้ำ */
async function apiFetch(fn, args) {
  const op = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  const body = JSON.stringify({ fn: fn, args: args, op: op });
  for (let i = 0; i < 4; i++) {
    if (i) await new Promise(r => setTimeout(r, 800 * i));
    let txt, j;
    try {
      const r = await fetch(API_URL, { method: 'POST', redirect: 'follow', credentials: 'omit', cache: 'no-store',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // text/plain = ไม่มี preflight
        body: body });
      txt = await r.text();
    } catch (e) { continue; }                 // เน็ตหลุด / Google ไม่ตอบ → ลองใหม่
    try { j = JSON.parse(txt); } catch (e) { continue; }   // ได้หน้า HTML แทน JSON → ลองใหม่
    if (!j.ok) throw new Error(j.error || 'เรียกระบบไม่สำเร็จ');
    return j.result;
  }
  throw new Error('เชื่อมต่อระบบไม่สำเร็จ (Google ตอบกลับไม่ทัน) กรุณาลองใหม่อีกครั้ง');
}
function api(fn, ...args) {
  if (IS_GAS) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(e => reject(e && e.message ? e : new Error(String(e))))[fn](...args);
    });
  }
  if (API_URL) return apiFetch(fn, args);
  return new Promise((resolve, reject) => setTimeout(() => {
    try { resolve(JSON.parse(JSON.stringify(Mock[fn](...args)))); } catch (e) { reject(e); }
  }, 250));
}
async function call(fn, ...args) {
  loading(true);
  try { return await api(fn, ...args); }
  catch (e) { toast(cleanErr(e), 'bad'); throw e; }
  finally { loading(false); }
}
function cleanErr(e) { return String(e && e.message || e).replace(/^Error:\s*/, '').replace(/^Exception:\s*/, ''); }

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function esc(v) { return String(v === undefined || v === null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad(n) { return String(n).padStart(2, '0'); }
function todayISO(d = new Date()) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function nowHM(d = new Date()) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function thDate(iso) { const p = String(iso || '').slice(0, 10).split('-'); return p.length === 3 ? (+p[2]) + ' ' + TH_MONTH[+p[1] - 1] + ' ' + (+p[0] + 543) : (iso || '-'); }
function thDateTime(s) { return s ? thDate(s) + ' ' + String(s).slice(11, 16) + ' น.' : '-'; }
function daysSince(s) { if (!s) return ''; const d = (Date.now() - new Date(String(s).replace(' ', 'T')).getTime()) / 864e5; return Math.max(0, Math.floor(d)); }

function toast(msg, type = '') {
  const t = document.createElement('div');

  document.body.appendChild(t);

}

function openModal(title, body, buttons = [], onClose) {

function stockTank(stock, sel) {
  const s = stock || {};

  return `<div class="tank">
    <svg viewBox="0 0 200 232" role="img" aria-label="น้ำมันในสต็อก เบิกได้ ${avail} ลิตร">
      <defs>
        <clipPath id="tkClip"><rect x="32" y="26" width="136" height="170"/><ellipse cx="100" cy="196" rx="68" ry="18"/></clipPath>

      </defs>
      <path d="M32 26v170a68 18 0 0 0 136 0V26z" fill="url(#tkBody)"/>
      <g clip-path="url(#tkClip)">
        ${avail ? `<rect x="32" y="${yA}" width="136" height="${BOT + 22 - yA}" fill="url(#tkOil)"/>
          <ellipse cx="100" cy="${yA}" rx="68" ry="18" fill="#fdba74"/>` : ''}
        ${pick ? `<rect x="32" y="${yA}" width="136" height="${Math.max(1, yP - yA)}" fill="url(#tkSel)"/>
          <path d="M32 ${yP}a68 18 0 0 0 136 0z" fill="#fdba74"/>
          <ellipse cx="100" cy="${yA}" rx="68" ry="18" fill="#7fb3e3"/>` : ''}
      </g>
      <path d="M32 88a68 18 0 0 0 136 0" fill="none" stroke="rgba(15,23,42,.16)" stroke-width="8"/>
      <path d="M32 140a68 18 0 0 0 136 0" fill="none" stroke="rgba(15,23,42,.16)" stroke-width="8"/>
      <path d="M32 26v170a68 18 0 0 0 136 0V26" fill="none" stroke="#7c8ca0" stroke-width="2.5"/>
      <ellipse cx="100" cy="26" rx="68" ry="18" fill="#dde3ea" stroke="#7c8ca0" stroke-width="2.5"/>
      <ellipse cx="128" cy="21" rx="12" ry="5.5" fill="#94a3b8"/>
      <rect x="38" y="80" width="124" height="72" rx="18" fill="#fff" opacity=".94"/>
      <text x="100" y="${num.length > 3 ? 120 : 124}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="#e65100">${num}</text>
      <text x="100" y="144" text-anchor="middle" font-size="13.5" font-weight="700" fill="#64748b">ลิตร ที่เบิกได้</text>
    </svg>
    <div class="cap">${pick ? `<b style="color:#2b6cb0">น้ำเงิน = จะเบิก ${pick} ลิตร</b> · ` : ''}ส้ม = น้ำมันที่เบิกได้ · จองแล้ว ${(+s.reserved || 0)} ลิตร · อยู่กับผู้เบิก ${(+s.out || 0)} ขวด</div>
  </div>`;
}
function requestRack(stock, sel) {
  const full = stock.bottles.filter(b => b.status === 'FULL');
  const empty = stock.bottles.filter(b => b.status === 'EMPTY');
  const avail = Math.max(0, full.length - stock.reserved);
  const html = full.map((b, i) => {
    const kind = i < Math.min(sel, avail) ? 'sel' : i < avail ? 'avail' : 'reserved';
    return bottleEl(b, kind);
  }).join('') + empty.map(b => bottleEl(b, 'empty')).join('');
  return `<div class="rack">${html || '<span class="muted">ไม่มีขวดในสต็อก</span>'}</div>
  <div class="legend">
    <span><i style="background:#2b6cb0"></i>จะเบิก</span>

}

/* =====================================================================
   QR SCANNER  (กล้อง -> jsQR, สำรอง: ถ่ายรูป QR / พิมพ์หมายเลข)
   ===================================================================== */
function parseBottleCode(txt) { return String(txt || '').trim().toUpperCase().replace(/^FUELBOTTLE:/, ''); }
/**
 * กล่องยิง QR — เปิดกล้องค้างไว้ ยิงทีละขวด ระบบเพิ่มให้อัตโนมัติ (เหมือนยิงบาร์โค้ดสินค้า)
 * scanGun({ mount, need, initial, validate(code)->error|null, onChange(codes), autostart })
 *   -> { codes(), stop(), start(), set(list), remove(code) }
 */
function scanGun(opt) {
  const host = typeof opt.mount === 'string' ? $(opt.mount) : opt.mount;
  if (!host) return { codes: () => [], stop: () => {}, start: () => {}, set: () => {}, remove: () => {} };
  let codes = (opt.initial || []).slice();
  let stream = null, raf = null, track = null, actx = null, torchOn = false;
  const seen = {};

  host.innerHTML = `
    <div class="gun" id="gBox">
      <video id="gVid" playsinline muted autoplay></video>
      <div class="frame"></div>
      <div class="gcount" id="gCount">0</div>
      <div class="gflash" id="gFlash"></div>
      <div class="goff" id="gOff"><span>กดปุ่ม <b>เปิดกล้อง</b> เพื่อเริ่มยิง QR</span></div>
    </div>
    <div class="gun-hit" id="gHit">กำลังเปิดกล้อง...</div>
    <div class="btn-row" style="margin-bottom:10px">
      <button type="button" class="btn ghost sm" id="gPower">เปิดกล้อง</button>
      <button type="button" class="btn ghost sm hidden" id="gTorch">ไฟฉาย</button>
      <button type="button" class="btn ghost sm" id="gPhoto">ถ่ายรูปแทน</button>
    </div>
    <div style="display:flex;gap:6px">
      <input class="input" id="gManual" placeholder="พิมพ์เอง / เครื่องยิงบาร์โค้ด เช่น FB-05" autocomplete="off">
      <button type="button" class="btn ghost" id="gAdd">เพิ่ม</button>
    </div>
    <div class="chips" id="gChips" style="margin-top:10px"></div>`;

  const box = $('#gBox', host), vid = $('#gVid', host), hit = $('#gHit', host);
  const say = (t, cls) => { hit.className = 'gun-hit ' + (cls || ''); hit.textContent = t; };
  const beep = ok => {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square'; o.frequency.value = ok ? 1760 : 300;
      g.gain.value = 0.05; o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + (ok ? 0.1 : 0.24));
    } catch (e) {}
  };
  const flash = ok => {
    const f = $('#gFlash', host); if (!f) return;
    f.classList.toggle('bad', !ok); f.classList.add('on');
    setTimeout(() => f.classList.remove('on'), 130);
  };
  const draw = () => {
    const c = $('#gCount', host);
    if (c) c.textContent = opt.need ? codes.length + ' / ' + opt.need : String(codes.length);
    $('#gChips', host).innerHTML = codes.map(x => `<span class="chip">${esc(x)}<button type="button" data-rm="${esc(x)}" aria-label="ลบ">×</button></span>`).join('');
    $$('#gChips [data-rm]', host).forEach(b => b.onclick = () => remove(b.dataset.rm));
    if (opt.onChange) opt.onChange(codes.slice());
  };
  const remove = code => {
    codes = codes.filter(x => x !== code); delete seen[code];
    say('เอาขวด ' + code + ' ออกแล้ว', 'warn'); draw();
    if (opt.need && codes.length < opt.need && !stream) start();
  };
  const add = raw => {
    const code = parseBottleCode(raw); if (!code) return false;
    const now = Date.now();
    if (seen[code] && now - seen[code] < 1500) return false;
    seen[code] = now;
    if (codes.indexOf(code) >= 0) { say(code + ' ยิงไปแล้ว', 'warn'); beep(false); flash(false); return false; }
    if (opt.need && codes.length >= opt.need) { say('ครบ ' + opt.need + ' ขวดแล้ว', 'warn'); beep(false); return false; }
    const err = opt.validate ? opt.validate(code) : null;
    if (err) { say(err, 'bad'); beep(false); flash(false); if (navigator.vibrate) navigator.vibrate([60, 40, 60]); return false; }
    codes.push(code); beep(true); flash(true);
    if (navigator.vibrate) navigator.vibrate(70);
    say('✓ ' + code + (opt.need ? '  (' + codes.length + '/' + opt.need + ')' : ''), 'ok');
    draw();
    if (opt.need && codes.length >= opt.need) { stop(); say('✓ ครบ ' + opt.need + ' ขวดแล้ว', 'ok'); }
    return true;
  };

  function stop() {
    if (raf) cancelAnimationFrame(raf); raf = null;
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null; track = null; torchOn = false;
    if (box) box.classList.remove('camon');
    const p = $('#gPower', host); if (p) p.textContent = 'เปิดกล้อง';
    const t = $('#gTorch', host); if (t) t.classList.add('hidden');
  }
  // เบราว์เซอร์ในแอป (LINE / Facebook / IG) มักไม่ให้ใช้กล้อง ต้องเปิดในเบราว์เซอร์ของเครื่อง
  const inAppBrowser = /Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(navigator.userAgent);
  const extUrl = () => location.href + (location.search ? '&' : '?') + 'openExternalBrowser=1';
  const sayFix = (msg) => {
    hit.className = 'gun-hit bad';
    hit.innerHTML = esc(msg) + (inAppBrowser
      ? ' — แตะ <a href="' + esc(extUrl()) + '" style="color:inherit">เปิดในเบราว์เซอร์ของเครื่อง</a> แล้วลองใหม่'
      : ' — ลองกด "เปิดกล้อง" อีกครั้ง หรือใช้ "ถ่ายรูปแทน" / พิมพ์หมายเลข');
  };

  function start() {
    if (stream) return;
    if (!window.jsQR) { sayFix('โหลดตัวอ่าน QR ไม่สำเร็จ'); return; }
    if (!window.isSecureContext) { sayFix('หน้านี้ไม่ได้เปิดผ่าน https กล้องจึงใช้ไม่ได้'); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { sayFix('เบราว์เซอร์นี้ไม่รองรับการเปิดกล้อง'); return; }
    say('กำลังเปิดกล้อง...');
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } } }).then(s => {
      if (!document.body.contains(host)) { s.getTracks().forEach(t => t.stop()); return; }
      stream = s; track = s.getVideoTracks()[0];
      vid.srcObject = s; vid.play().catch(() => {});
      box.classList.add('camon');
      $('#gPower', host).textContent = 'ปิดกล้อง';
      try { if (track.getCapabilities && track.getCapabilities().torch) $('#gTorch', host).classList.remove('hidden'); } catch (e) {}
      say('เล็ง QR บนขวดทีละใบ — ระบบเพิ่มให้เอง');
      const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
      const tick = () => {
        if (!stream || !document.body.contains(host)) return stop();
        if (vid.readyState === vid.HAVE_ENOUGH_DATA && vid.videoWidth) {
          const k = Math.min(1, 640 / Math.max(vid.videoWidth, vid.videoHeight));
          cv.width = Math.round(vid.videoWidth * k); cv.height = Math.round(vid.videoHeight * k);
          cx.drawImage(vid, 0, 0, cv.width, cv.height);
          const q = jsQR(cx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height, { inversionAttempts: 'dontInvert' });
          if (q && q.data) add(q.data);
        }
        raf = requestAnimationFrame(tick);
      };
      tick();
    }).catch(err => {
      const n = (err && err.name) || '';
      sayFix(n === 'NotAllowedError' ? 'เบราว์เซอร์ไม่อนุญาตให้ใช้กล้อง'
        : n === 'NotFoundError' || n === 'OverconstrainedError' ? 'ไม่พบกล้องที่ใช้ได้ในเครื่องนี้'
        : n === 'NotReadableError' ? 'กล้องถูกแอปอื่นใช้อยู่'
        : 'เปิดกล้องไม่ได้ (' + (n || 'ไม่ทราบสาเหตุ') + ')');
    });
  }

  $('#gPower', host).onclick = () => stream ? (stop(), say('ปิดกล้องแล้ว')) : start();
  $('#gTorch', host).onclick = () => {
    if (!track) return;
    torchOn = !torchOn;
    track.applyConstraints({ advanced: [{ torch: torchOn }] }).catch(() => say('มือถือนี้เปิดไฟฉายไม่ได้', 'warn'));
  };
  const man = $('#gManual', host);
  $('#gAdd', host).onclick = () => { add(man.value); man.value = ''; man.focus(); };
  man.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#gAdd', host).click(); } };
  $('#gPhoto', host).onclick = () => {
    let f = $('#gunFile');
    if (!f) { f = document.createElement('input'); f.type = 'file'; f.accept = 'image/' + '*'; f.setAttribute('capture', 'environment'); f.id = 'gunFile'; f.className = 'hidden'; document.body.appendChild(f); }
    f.value = '';
    f.onchange = async () => {
      const file = f.files[0]; if (!file) return;
      say('กำลังอ่าน QR จากรูป...');
      try {
        const res = await photoWithCodes(file, opt.need ? opt.need - codes.length : 0);
        if (!res.codes.length) return say('อ่าน QR จากรูปไม่ได้ ลองถ่ายใกล้ขึ้น', 'bad');
        let n = 0; res.codes.forEach(c => { if (add(c)) n++; });
        if (n) say('เพิ่มจากรูป ' + n + ' ขวด', 'ok');
      } catch (e) { say('อ่านรูปไม่ได้', 'bad'); }
    };
    f.click();
  };

  draw();
  if (opt.autostart !== false) start();
  return {
    codes: () => codes.slice(),
    set: list => { codes = (list || []).slice(); draw(); },
    remove, stop, start
  };
}

/** openScanner({title, need, validate(code)->error|null, initial, onDone(codes)}) — กล่องยิง QR แบบ popup */
function openScanner(opt) {
  let ctl = null;
  const stop = () => { if (ctl) ctl.stop(); };
  openModal(opt.title || 'ยิง QR ขวดน้ำมัน', '<div id="gunMount"></div>',
    [{ label: 'ยกเลิก', cls: 'ghost', onClick: stop },
     { label: 'ใช้รายการนี้', cls: 'primary', onClick: () => { stop(); opt.onDone(ctl ? ctl.codes() : []); } }], stop);
  ctl = scanGun({ mount: '#gunMount', need: opt.need, initial: opt.initial, validate: opt.validate });
}

/** อ่าน QR หลายอันจากรูปเดียว (แบ่งรูปเป็นตารางย่อย) */
function decodeQRCodes(canvas, want) {
  if (!window.jsQR) return [];
  const found = [];
  const push = v => { const c = parseBottleCode(v); if (c && found.indexOf(c) < 0) found.push(c); };
  const enough = () => want && found.length >= want;

  // อ่าน QR ในภาพ แล้วลบตำแหน่งที่อ่านได้ทิ้ง เพื่อหาอันถัดไป (รูปเดียวอ่านได้หลายขวด)
  const scanErase = (cv, limit) => {
    const cx = cv.getContext('2d', { willReadFrequently: true });
    for (let i = 0; i < limit; i++) {
      const d = cx.getImageData(0, 0, cv.width, cv.height);
      const q = jsQR(d.data, d.width, d.height, { inversionAttempts: 'attemptBoth' });
      if (!q || !q.data) break;
      push(q.data);
      const L = q.location, pts = [L.topLeftCorner, L.topRightCorner, L.bottomLeftCorner, L.bottomRightCorner];
      const xs = pts.map(p => p.x), ys = pts.map(p => p.y), pad = 8;
      cx.fillStyle = '#ffffff';
      cx.fillRect(Math.min.apply(null, xs) - pad, Math.min.apply(null, ys) - pad,
                  Math.max.apply(null, xs) - Math.min.apply(null, xs) + pad * 2,
                  Math.max.apply(null, ys) - Math.min.apply(null, ys) + pad * 2);
      if (enough()) return;
    }
  };
  const copyOf = (src, sx, sy, sw, sh, out) => {
    const k = Math.min(2, out / Math.max(sw, sh));
    const c = document.createElement('canvas');
    c.width = Math.round(sw * k); c.height = Math.round(sh * k);
    c.getContext('2d').drawImage(src, sx, sy, sw, sh, 0, 0, c.width, c.height);
    return c;
  };

  const W = canvas.width, H = canvas.height;
  scanErase(copyOf(canvas, 0, 0, W, H, Math.max(W, H)), 12);   // ทั้งรูปก่อน
  if (enough()) return found;

  // ถ้ายังไม่ครบ ไล่อ่านทีละส่วนของรูป (ช่วยกรณี QR เล็กหรือวางชิดกัน)
  const base = Math.min(W, H);
  [1, 1.6, 2.4, 3.5].forEach(div => {
    if (enough()) return;
    const win = Math.round(base / div);
    if (win < 80) return;
    const step = Math.max(40, Math.round(win / 2));
    for (let y = 0; y < H && !enough(); y += step) {
      for (let x = 0; x < W && !enough(); x += step) {
        const w = Math.min(win, W - x), h = Math.min(win, H - y);
        if (w < 80 || h < 80) continue;
        scanErase(copyOf(canvas, x, y, w, h, 600), 4);
      }
    }
  });
  return found;
}

async function photoWithCodes(file, want) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const draw = max => {
    const k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c;
  };
  const codes = decodeQRCodes(draw(1600), want);        // ใช้ภาพใหญ่ในการอ่าน QR
  const url = draw(1280).toDataURL('image/jpeg', 0.85); // ภาพที่ส่งเข้าระบบ
  URL.revokeObjectURL(img.src);
  return { codes, photo: { dataUrl: url, data: url.split(',')[1], mimeType: 'image/jpeg' } };
}

/** ย่อรูปก่อนส่ง (สูงสุด 1280px, JPEG) */
function compressImage(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const url = c.toDataURL('image/jpeg', 0.8);
      URL.revokeObjectURL(img.src);
      res({ dataUrl: url, data: url.split(',')[1], mimeType: 'image/jpeg' });
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

<script>
/* =====================================================================
   PAGE: ขอเบิกน้ำมัน
   ===================================================================== */
function newForm() {
  return { reqDate: todayISO(), reqTime: nowHM(), requesterId: (S.form && S.form.requesterId) || '', itemType: '', itemId: '', amountMode: 'FULL', amount: '', liters: 1, note: '' };
}
function pageRequest() {
  if (!S.form) S.form = newForm();
  const F = S.form, items = S.boot.items;
  const types = [...new Set(items.map(i => i.type))];
  $('#view').innerHTML = `
  <section class="card">
    <div class="card-head"><h2>แบบขอเบิกน้ำมันเชื้อเพลิง</h2>${stockMini()}</div>
    <div class="grid3">
      <div class="field"><label class="f" for="fDate">วันที่เบิก <span class="live ${S.live ? '' : 'hidden'}" id="liveTag"><i></i>ปัจจุบัน</span></label>
        <input id="fDate" type="date" class="input" value="${esc(F.reqDate)}"></div>
      <div class="field"><label class="f" for="fTime">เวลา</label>

      <textarea id="fNote" class="input" placeholder="เช่น ไปราชการ, ตัดหญ้าบริเวณ...">${esc(F.note)}</textarea></div>
    <button class="btn primary block" id="fSubmit">ขออนุมัติ</button>
  </section>
  <section class="card" id="myReq"><h3>คำขอล่าสุดของฉัน</h3><div class="empty small">เลือกชื่อผู้ขอเบิกเพื่อดูประวัติ</div></section>`;

  const stopLive = () => { if (S.live) { S.live = false; $('#liveTag').classList.add('hidden'); $('#liveReset').classList.remove('hidden'); } };
  $('#fDate').oninput = e => { F.reqDate = e.target.value; stopLive(); };
  $('#fTime').oninput = e => { F.reqTime = e.target.value; stopLive(); };

    F.reqDate = todayISO(); F.reqTime = nowHM();
    const d = $('#fDate'), t = $('#fTime');
    if (d && document.activeElement !== d) d.value = F.reqDate;
    if (t && document.activeElement !== t) t.value = F.reqTime;
  }, 15000);
  $('#fUser').onchange = e => { F.requesterId = e.target.value; loadMyRequests(); };

  $('#fSubmit').onclick = submitRequest;

}
/** เลือกประเภทรถ/เครื่อง แล้วเลือกรายการ (แบบเลื่อนลง) */
function renderItemPicker() {
  const F = S.form, items = S.boot.items;
  const types = [...new Set(items.map(i => i.type))];
  if (F.itemId && !F.itemType) { const it = items.find(i => i.id === F.itemId); if (it) F.itemType = it.type; }
  const list = items.filter(i => i.type === F.itemType);
  const cur = items.find(i => i.id === F.itemId);
  $('#itemPicker').innerHTML = `
    <div class="grid2">
      <div class="field"><label class="f" for="fType">ประเภทรถ / เครื่อง</label>
        <select id="fType" class="input"><option value="">— เลือกประเภท —</option>
          ${types.map(t => `<option value="${esc(t)}" ${t === F.itemType ? 'selected' : ''}>${esc(t)} (${items.filter(i => i.type === t).length})</option>`).join('')}
        </select></div>
      <div class="field"><label class="f" for="fItem">รายการ / ทะเบียน</label>
        <select id="fItem" class="input" ${F.itemType ? '' : 'disabled'}><option value="">${F.itemType ? '— เลือกรายการ —' : 'เลือกประเภทก่อน'}</option>
          ${list.map(i => `<option value="${esc(i.id)}" ${i.id === F.itemId ? 'selected' : ''}>${esc(i.order)}. ${esc(i.name)}${i.plate ? ' — ทะเบียน ' + esc(i.plate) : ''}</option>`).join('')}
        </select></div>
    </div>
    ${cur ? `<div class="tags" style="margin:-4px 0 4px;display:flex;gap:6px;flex-wrap:wrap">${fuelTag(cur.fuelType)}${srcTag(cur.source)}</div>` : ''}`;
  $('#fType').onchange = e => {
    F.itemType = e.target.value;
    const l = S.boot.items.filter(i => i.type === F.itemType);
    F.itemId = l.length === 1 ? l[0].id : '';
    renderItemPicker(); renderAmount();
  };
  $('#fItem').onchange = e => { F.itemId = e.target.value; renderItemPicker(); renderAmount(); };
}
function stockMini() {
  const s = S.boot.stock;
  return `<span class="small muted">สต็อกเบนซิน: ให้เบิกได้ <b style="color:var(--benzin)">${s.available}</b> ลิตร</span>`;
}
function renderAmount() {
  const F = S.form, box = $('#amountBox');
  const item = S.boot.items.find(i => i.id === F.itemId);
  if (!item) { box.innerHTML = '<div class="alert info">เลือกประเภทและรายการด้านบนก่อน</div>'; $('#fSubmit').disabled = false; return; }
  const cfg = S.boot.config, st = S.boot.stock;
  if (item.source === 'STOCK') {
    if (F.liters > st.available) F.liters = Math.max(cfg.stockMin, Math.min(st.available, cfg.stockMax));
    const opts = []; for (let n = cfg.stockMin; n <= cfg.stockMax; n++) opts.push(n);
    const enough = st.available >= cfg.stockMin;
    box.innerHTML = `
      <div class="card-head" style="margin-bottom:8px"><h3>เบิกจากสต็อก — ${esc(item.name)} ${fuelTag(item.fuelType)}</h3>
        <button class="btn purple sm" id="btnRefill">แจ้งเติมสต็อก</button></div>
      ${stockTank(st, enough ? F.liters : 0)}
      <div style="margin-top:12px"><label class="f">จำนวนลิตร (ขวดละ 1 ลิตร เบิกได้ ${cfg.stockMin}-${cfg.stockMax} ลิตร)</label>
        <div class="liters">${opts.map(n => `<button type="button" data-l="${n}" class="${n === F.liters && enough ? 'on' : ''}" ${n > st.available ? 'disabled' : ''}>${n}</button>`).join('')}</div>
      </div>
      ${enough ? `<div class="hint">คงเหลือขวดเต็ม ${st.balance} ขวด · จองแล้ว ${st.reserved} · ให้เบิกได้ ${st.available} ลิตร</div>`
               : `<div class="alert bad">น้ำมันในสต็อกไม่พอให้เบิก (ให้เบิกได้ ${st.available} ลิตร) — กด "แจ้งเติมสต็อก" เพื่อแจ้งผู้เกี่ยวข้อง</div>`}`;
    $$('[data-l]', box).forEach(b => b.onclick = () => { F.liters = +b.dataset.l; renderAmount(); });
    $('#btnRefill').onclick = notifyRefillDlg;
    $('#fSubmit').disabled = !enough;
  } else {
    const isRefill = item.type === 'เติมสต็อก';
    box.innerHTML = `
      <h3 style="margin-bottom:8px">เบิกเติมที่ปั๊มน้ำมัน — ${esc(item.name)} ${item.plate ? 'ทะเบียน ' + esc(item.plate) : ''} ${fuelTag(item.fuelType)}</h3>
      ${isRefill ? `<div class="alert info">เติมน้ำมันลงขวดเปล่าที่สต็อก (ขวดเปล่า ${st.empty} ขวด · ขวดอยู่กับผู้เบิก ${st.out} ขวด) เมื่อได้น้ำมันแล้ว ผู้จ่ายสต็อกจะสแกนขวดรับเข้าสต็อก</div>` : ''}
      <div class="seg" role="tablist">
        <button type="button" data-m="FULL" class="${F.amountMode === 'FULL' ? 'on' : ''}">เต็มถัง</button>
        <button type="button" data-m="LITER" class="${F.amountMode === 'LITER' ? 'on' : ''}">ระบุลิตร</button>
        <button type="button" data-m="BAHT" class="${F.amountMode === 'BAHT' ? 'on' : ''}">ระบุบาท</button>
      </div>
      <div class="field ${F.amountMode === 'FULL' ? 'hidden' : ''}" style="margin-top:10px;max-width:260px">
        <label class="f" for="fAmt">จำนวน${F.amountMode === 'BAHT' ? 'เงิน (บาท)' : 'ลิตร'}</label>
        <input id="fAmt" class="input" type="number" min="1" step="${F.amountMode === 'BAHT' ? '1' : '0.5'}" inputmode="decimal" value="${esc(F.amount)}"></div>`;
    $$('[data-m]', box).forEach(b => b.onclick = () => { F.amountMode = b.dataset.m; renderAmount(); });
    const a = $('#fAmt'); if (a) a.oninput = e => F.amount = e.target.value;
    $('#fSubmit').disabled = false;
  }
}
async function submitRequest() {
  const F = S.form, item = S.boot.items.find(i => i.id === F.itemId);
  const user = S.boot.users.find(u => u.id === F.requesterId);
  if (!user) return toast('กรุณาเลือกชื่อผู้ขอเบิก', 'bad');
  if (!item) return toast('กรุณาเลือกรายการรถ/เครื่อง', 'bad');
  if (!F.reqDate || !F.reqTime) return toast('กรุณาระบุวันที่และเวลา', 'bad');
  const payload = { reqDate: F.reqDate, reqTime: F.reqTime, requesterId: user.id, itemId: item.id, note: F.note };
  let amt;
  if (item.source === 'STOCK') { payload.amount = F.liters; amt = F.liters + ' ลิตร'; }
  else {
    payload.amountMode = F.amountMode; payload.amount = F.amount;
    if (F.amountMode !== 'FULL' && !(+F.amount > 0)) return toast('กรุณาระบุจำนวน', 'bad');
    amt = F.amountMode === 'FULL' ? 'เต็มถัง' : F.amount + (F.amountMode === 'BAHT' ? ' บาท' : ' ลิตร');
  }
  const ok = await confirmBox('ยืนยันขออนุมัติเบิกน้ำมัน', `<dl class="kv">
    <dt>วันที่/เวลา</dt><dd>${thDate(F.reqDate)} ${esc(F.reqTime)} น.</dd>
    <dt>ผู้ขอเบิก</dt><dd>${esc(user.name)}</dd>
    <dt>รายการ</dt><dd>${esc(item.type)} ${item.plate ? 'ทะเบียน ' + esc(item.plate) : ''}<br>${esc(item.name)}</dd>
    <dt>น้ำมัน</dt><dd>${fuelTag(item.fuelType)} ${srcTag(item.source)}</dd>
    <dt>จำนวน</dt><dd class="big">${esc(amt)}</dd>
    ${F.note ? `<dt>หมายเหตุ</dt><dd>${esc(F.note)}</dd>` : ''}</dl>
    <div class="alert info">ระบบจะแจ้งเตือน (LINE/Telegram) ${item.source === 'STOCK' ? 'ผู้อนุมัติเบิกจากสต็อก' : 'ผู้อนุมัติเบิกเติมที่ปั๊ม'}</div>`, 'ส่งขออนุมัติ');
  if (!ok) return;
  try {
    const res = await call('createRequest', payload);
    S.boot.stock = res.stock;
    openModal('ส่งคำขอเรียบร้อย', `<div class="alert ok">เลขที่คำขอ <b>${esc(res.reqId)}</b><br>แจ้งผู้อนุมัติ (LINE/Telegram) แล้ว${res.lineSent ? ' (' + res.lineSent + ' คน)' : ''}</div>
      <p class="muted small">ติดตามสถานะได้ที่ "คำขอล่าสุดของฉัน" และจะได้รับ LINE เมื่อมีการอนุมัติ</p>`, [{ label:'ตกลง', cls:'primary' }]);
    const keep = F.requesterId; S.form = newForm(); S.form.requesterId = keep; S.live = true;
    pageRequest();
  } catch (e) {}
}

      </dl>
      <div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)">
        <label class="f">จำนวนที่อนุมัติ</label>
        <div class="seg">${['FULL', 'LITER', 'BAHT'].map(m => `<button type="button" data-pm="${m}" class="${r.amountMode === m ? 'on' : ''}">${{ FULL:'เต็มถัง', LITER:'ระบุลิตร', BAHT:'ระบุบาท' }[m]}</button>`).join('')}</div>
        <input class="input pm-amt ${r.amountMode === 'FULL' ? 'hidden' : ''}" type="number" min="1" value="${esc(r.amount)}" style="max-width:180px;margin-top:8px" placeholder="จำนวน">

          <button class="btn ok" data-act="approve">อนุมัติ</button>

        </div>
      </div>
    </div>`).join('') : '<div class="empty">ไม่มีรายการรออนุมัติ</div>'}
  </section>
  ${historyCard('ดำเนินการล่าสุด', done)}`;

  $$('[data-req]').forEach(card => {
    const reqId = card.dataset.req; let mode = pend.find(r => r.reqId === reqId).amountMode;
    $$('[data-pm]', card).forEach(b => b.onclick = () => {
      mode = b.dataset.pm; $$('[data-pm]', card).forEach(x => x.classList.toggle('on', x === b));
      $('.pm-amt', card).classList.toggle('hidden', mode === 'FULL');

    });
  });
}

        act === 'approve' ? 'อนุมัติ' : 'ไม่อนุมัติ', act === 'approve' ? 'ok' : 'bad');
      if (!ok) return;
      try { const res = await call('approveStock', S.auth, reqId, act, n, note, dispId); toast(act === 'approve' ? 'อนุมัติแล้ว ส่งเรื่องถึง ' + ((res && res.sentTo) || 'ผู้จ่ายสต็อก') : 'บันทึกไม่อนุมัติแล้ว', 'ok'); refreshCounts(); pageStock(); } catch (e) {}
    });
  });
}
</script>

<script>
/* =====================================================================
   PAGE: ผู้จ่ายสต็อก — จ่ายน้ำมัน (สแกนขวด) / รับคืนขวดเปล่า / เติมเข้าสต็อก
   ===================================================================== */
const DISP = { scanned: {}, photo: {} };
async function pageDispense() {
  $('#view').innerHTML = '<div class="empty">กำลังโหลด...</div>';
  let rows, s;
  try { [rows, s] = await Promise.all([api('listRequests', S.auth, { status: 'APPROVED' }), reloadStock()]); }
  catch (e) { $('#view').innerHTML = `<div class="alert bad">${esc(cleanErr(e))}</div>`; return; }
  const wait = rows.filter(r => r.source === 'STOCK').reverse();
  const refills = rows.filter(r => r.itemType === 'เติมสต็อก').reverse();
  const T = S.dispTab;
  $('#view').innerHTML = `
  <section class="card">
    <div class="card-head"><h2>ผู้จ่ายสต็อก</h2><button class="btn ghost sm" onclick="pageDispense()">รีเฟรช</button></div>
    ${stockTiles(s)}
    <div class="subtabs seg">
      <button data-dt="wait" class="${T === 'wait' ? 'on' : ''}">รอจ่ายน้ำมัน (${wait.length})</button>
      <button data-dt="return" class="${T === 'return' ? 'on' : ''}">รับคืนขวดเปล่า (${s.out})</button>
      <button data-dt="refill" class="${T === 'refill' ? 'on' : ''}">เติมน้ำมันเข้าสต็อก (${refills.length})</button>
    </div>
    <div id="dispBody"></div>
  </section>`;
  $$('[data-dt]').forEach(b => b.onclick = () => { S.dispTab = b.dataset.dt; pageDispense(); });
  if (T === 'wait') dispWait(wait, s); else if (T === 'return') dispReturn(s); else dispRefill(refills, s);
}

function dispWait(wait, s) {
  const box = $('#dispBody');
  if (!wait.length) { box.innerHTML = '<div class="empty">ไม่มีรายการรอจ่าย</div>'; return; }
  box.innerHTML = wait.map(r => {
    const need = +(r.approvedAmount || r.amount), sc = DISP.scanned[r.reqId] || [], ph = DISP.photo[r.reqId];
    return `<div class="req" data-req="${esc(r.reqId)}">
      <div class="req-top"><div><span class="req-id">${esc(r.reqId)}</span><div class="small muted">อนุมัติโดย ${esc(r.approverName)} · ${thDateTime(r.approvedAt)}</div></div>${stBadge(r)}</div>
      <dl class="kv">
        <dt>วันที่เบิก</dt><dd>${thDate(r.reqDate)} ${esc(r.reqTime)} น.</dd>
        <dt>ผู้ขอ</dt><dd>${esc(r.requesterName)}</dd>
        <dt>ประเภท</dt><dd>${esc(r.itemType)} · ${esc(r.itemName)}</dd>
        <dt>จำนวนจ่าย</dt><dd class="big" style="color:var(--benzin)">${need} ลิตร (${need} ขวด)</dd>
        ${r.assignedName ? `<dt>ผู้จ่ายที่รับผิดชอบ</dt><dd>${esc(r.assignedName)}</dd>` : ''}
        ${r.approveNote ? `<dt>หมายเหตุ</dt><dd>${esc(r.approveNote)}</dd>` : ''}
      </dl>
      <div style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)">
        <label class="f">1) ยิง QR ขวดทีละใบจนครบ <span class="${sc.length === need ? '' : 'muted'}">(${sc.length}/${need})</span></label>
        <div class="chips" style="margin-bottom:8px">${sc.map(c => `<span class="chip">${esc(c)}</span>`).join('') || '<span class="small muted">ยังไม่ได้ยิง QR</span>'}</div>
        <button class="btn orange sm" data-scan>เปิดกล้องยิง QR</button>
        <label class="f" style="margin-top:14px">2) รูปถ่ายตอนจ่าย <span class="muted" style="font-weight:400">(ไม่บังคับ)</span></label>
        <div class="pick2">
          <label class="btn ghost sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>ถ่ายรูป<input type="file" class="vh" data-photo accept="image/${'*'}" capture="environment"></label>
          <label class="btn ghost sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>เลือกไฟล์ภาพ<input type="file" class="vh" data-photo accept="image/${'*'}"></label>
        </div>
        ${ph ? `<img class="photo-prev" src="${ph.dataUrl}" alt="รูปน้ำมันที่จ่าย">` : ''}
        <input class="input" data-note placeholder="หมายเหตุผู้จ่าย (ถ้ามี)" style="margin-top:10px">
        <button class="btn ok block" style="margin-top:12px" data-go-disp ${sc.length === need ? '' : 'disabled'}>3) จ่ายน้ำมันแล้ว — ตัดสต็อก</button>
      </div></div>`;
  }).join('');

  $$('[data-req]', box).forEach(card => {
    const reqId = card.dataset.req, r = wait.find(x => x.reqId === reqId), need = +(r.approvedAmount || r.amount);
    $('[data-scan]', card).onclick = () => openScanner({
      title: `ยิง QR ขวดสำหรับ ${reqId} (${need} ขวด)`, need, initial: DISP.scanned[reqId],
      validate: code => {
        const b = s.bottles.find(x => x.code === code);
        if (!b) return 'ไม่พบขวดหมายเลข ' + code;
        if (b.status === 'EMPTY') return code + ' เป็นขวดเปล่า';
        if (b.status === 'OUT') return code + ' อยู่กับ ' + b.holderName;
        const other = Object.keys(DISP.scanned).find(k => k !== reqId && DISP.scanned[k].includes(code));
        return other ? code + ' ถูกสแกนไว้กับคำขอ ' + other : null;
      },
      onDone: codes => { DISP.scanned[reqId] = codes; dispWait(wait, s); }
    });
    const onPhoto = async e => {
      const f = e.target.files[0]; e.target.value = ''; if (!f) return;
      if (f.type && !/^image\//.test(f.type)) return toast('กรุณาเลือกไฟล์รูปภาพ (JPG / PNG)', 'bad');
      loading(true);
      try {
        const out = await photoWithCodes(f, need);          // รูปแนบเป็นหลักฐาน + ถ้าอ่าน QR ได้ก็เพิ่มให้เลย
        DISP.photo[reqId] = out.photo;
        const cur = DISP.scanned[reqId] || [];
        const bad = [];
        out.codes.forEach(c => {
          if (cur.includes(c) || cur.length >= need) return;
          const b = s.bottles.find(x => x.code === c);
          if (!b) bad.push('ไม่พบขวด ' + c);
          else if (b.status !== 'FULL') bad.push(c + (b.status === 'EMPTY' ? ' เป็นขวดเปล่า' : ' อยู่กับ ' + b.holderName));
          else cur.push(c);
        });
        DISP.scanned[reqId] = cur;
        if (out.codes.length) toast('อ่าน QR จากรูปได้ ' + out.codes.length + ' ขวด' + (bad.length ? ' (ข้าม ' + bad.length + ')' : ''), bad.length ? '' : 'ok');
        else toast('แนบรูปแล้ว (อ่าน QR จากรูปไม่ได้ ให้ยิง QR ด้วยกล้อง)', '');
        dispWait(wait, s);
      } catch (err) { toast('อ่านรูปนี้ไม่ได้ — ลองไฟล์ JPG หรือ PNG', 'bad'); }
      finally { loading(false); }
    };
    $$('[data-photo]', card).forEach(i => i.onchange = onPhoto);
    $('[data-go-disp]', card).onclick = async () => {
      const codes = DISP.scanned[reqId] || [], note = $('[data-note]', card).value;
      const ph2 = DISP.photo[reqId];
      const ok = await confirmBox('ยืนยันจ่ายน้ำมัน', `<p>จ่ายให้ <b>${esc(r.requesterName)}</b> จำนวน <b>${need} ลิตร</b></p>
        <p>ขวด: <b>${codes.map(esc).join(', ')}</b></p>${ph2 ? `<img class="photo-prev" src="${ph2.dataUrl}" alt="">` : '<p class="small muted">ไม่ได้แนบรูป</p>'}
        <p class="small muted">ระบบจะตัดสต็อก บันทึกว่าขวดอยู่กับผู้ขอ และแจ้งผู้ขอเบิก (LINE/Telegram)</p>`, 'จ่ายน้ำมันแล้ว', 'ok');
      if (!ok) return;
      try {
        const res = await call('dispense', S.auth, reqId, ph2 ? { data: ph2.data, mimeType: 'image/jpeg' } : null, codes, note);
        delete DISP.scanned[reqId]; delete DISP.photo[reqId];
        S.boot.stock = res.stock;
        toast('จ่ายน้ำมันและตัดสต็อกแล้ว', 'ok'); refreshCounts(); pageDispense();
      } catch (e) {}
    };
  });
}

function dispReturn(s) {
  const box = $('#dispBody');
  const out = s.bottles.filter(b => b.status === 'OUT');
  box.innerHTML = `
    <div class="alert info">สแกน QR ขวดเปล่าที่ผู้เบิกนำมาคืน ระบบจะเปลี่ยนสถานะเป็น "ขวดเปล่าที่สต็อก"</div>
    <button class="btn purple" id="btnRet">สแกนรับคืนขวดเปล่า</button>
    <h3 style="margin:16px 0 6px">ขวดที่ยังอยู่กับผู้เบิก (${out.length})</h3>
    ${out.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>ขวด</th><th>อยู่กับ</th><th>คำขอ</th><th>ตั้งแต่</th><th class="num">วัน</th></tr></thead><tbody>
      ${out.map(b => `<tr><td><b>${esc(b.code)}</b></td><td>${esc(b.holderName)}</td><td>${esc(b.reqId)}</td><td>${thDateTime(b.updatedAt)}</td><td class="num">${daysSince(b.updatedAt)}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty small">ไม่มีขวดค้างอยู่กับผู้เบิก</div>'}`;
  $('#btnRet').onclick = () => openScanner({
    title: 'สแกนรับคืนขวดเปล่า',
    validate: code => {
      const b = s.bottles.find(x => x.code === code);
      if (!b) return 'ไม่พบขวดหมายเลข ' + code;
      if (b.status !== 'OUT') return code + (b.status === 'FULL' ? ' เป็นขวดเต็มอยู่ที่สต็อก' : ' เป็นขวดเปล่าอยู่ที่สต็อกแล้ว');
      return null;
    },
    onDone: async codes => {
      if (!codes.length) return;
      const list = codes.map(c => { const b = s.bottles.find(x => x.code === c); return `<li><b>${esc(c)}</b> จาก ${esc(b.holderName)}</li>`; }).join('');
      const ok = await confirmBox('ยืนยันรับคืนขวดเปล่า', `<ul>${list}</ul>`, 'รับคืน', 'purple');
      if (!ok) return;
      try { const r = await call('returnBottles', S.auth, codes, ''); S.boot.stock = r.stock; toast('รับคืนขวดเปล่า ' + codes.length + ' ขวดแล้ว', 'ok'); pageDispense(); } catch (e) {}
    }
  });
}

function dispRefill(refills, s) {
  const box = $('#dispBody');
  const empty = s.bottles.filter(b => b.status === 'EMPTY');
  let sel = [], reqId = refills.length ? refills[0].reqId : '';
  const draw = () => {
    box.innerHTML = `
    <div class="alert info">เมื่อได้น้ำมันจากปั๊มแล้ว ให้เติมลงขวดเปล่า แล้วสแกนหรือแตะเลือกขวดที่เติมเต็มแล้ว (ขวดละ 1 ลิตร)</div>
    <div class="field"><label class="f" for="rfReq">อ้างอิงคำขอเบิกเติมสต็อก</label>
      <select id="rfReq" class="input"><option value="">— ไม่อ้างอิง —</option>
      ${refills.map(r => `<option value="${esc(r.reqId)}" ${r.reqId === reqId ? 'selected' : ''}>${esc(r.reqId)} · ${esc(r.requesterName)} · ${esc(amountText(r))} · ${thDate(r.reqDate)}</option>`).join('')}</select></div>
    <label class="f">ขวดเปล่าที่สต็อก (${empty.length}) — แตะเพื่อเลือก</label>
    <div class="rack" id="rfRack">${empty.map(b => `<button type="button" data-b="${esc(b.code)}" style="border:0;background:none;padding:0;cursor:pointer">${bottleEl(b, sel.includes(b.code) ? 'sel' : 'empty')}</button>`).join('') || '<span class="muted">ไม่มีขวดเปล่า</span>'}</div>
    <div class="btn-row" style="margin-top:10px">
      <button class="btn ghost sm" id="rfScan">สแกน QR</button>
      <button class="btn ghost sm" id="rfAll">เลือกทั้งหมด</button>
      <button class="btn ghost sm" id="rfNone">ล้าง</button>
    </div>
    <div style="margin-top:12px" class="big">เติมเข้าสต็อก ${sel.length} ลิตร</div>
    <button class="btn ok block" id="rfGo" style="margin-top:10px" ${sel.length ? '' : 'disabled'}>บันทึกรับเข้าสต็อก</button>`;
    $('#rfReq').onchange = e => reqId = e.target.value;
    $$('[data-b]', box).forEach(b => b.onclick = () => { const c = b.dataset.b; sel = sel.includes(c) ? sel.filter(x => x !== c) : sel.concat(c); draw(); });
    $('#rfAll').onclick = () => { sel = empty.map(b => b.code); draw(); };
    $('#rfNone').onclick = () => { sel = []; draw(); };
    $('#rfScan').onclick = () => openScanner({
      title: 'สแกนขวดที่เติมน้ำมันแล้ว', initial: sel,
      validate: code => { const b = s.bottles.find(x => x.code === code); if (!b) return 'ไม่พบขวด ' + code; return b.status === 'EMPTY' ? null : code + (b.status === 'FULL' ? ' เป็นขวดเต็มอยู่แล้ว' : ' ยังอยู่กับ ' + b.holderName + ' (ต้องรับคืนก่อน)'); },
      onDone: codes => { sel = codes; draw(); }
    });
    $('#rfGo').onclick = async () => {
      const ok = await confirmBox('ยืนยันรับน้ำมันเข้าสต็อก', `<p>เติม <b>${sel.length} ลิตร</b> ลงขวด ${sel.map(esc).join(', ')}</p>${reqId ? `<p>อ้างอิงคำขอ ${esc(reqId)}</p>` : ''}`, 'บันทึก', 'ok');
      if (!ok) return;
      try { const r = await call('receiveStock', S.auth, reqId, sel, ''); S.boot.stock = r.stock; toast('รับเข้าสต็อก ' + sel.length + ' ลิตรแล้ว', 'ok'); refreshCounts(); pageDispense(); } catch (e) {}
    };
  };
  draw();
}

/* =====================================================================
   PAGE: รายงาน + พิมพ์
   ===================================================================== */
const RPT = { from: '', to: '', source: 'STOCK', status: 'DONE', data: null };
function pageReport() {
  if (!RPT.from) { const d = new Date(); RPT.from = todayISO(new Date(d.getFullYear(), d.getMonth(), 1)); RPT.to = todayISO(d); }
  $('#view').innerHTML = `
  <section class="card">
    <div class="card-head"><h2>รายงานการเบิกน้ำมัน</h2></div>
    <div class="grid3" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
      <div class="field"><label class="f" for="rpFrom">ตั้งแต่วันที่</label><input id="rpFrom" type="date" class="input" value="${RPT.from}"></div>
      <div class="field"><label class="f" for="rpTo">ถึงวันที่</label><input id="rpTo" type="date" class="input" value="${RPT.to}"></div>
      <div class="field"><label class="f" for="rpSrc">ประเภท</label><select id="rpSrc" class="input">
        <option value="STOCK" ${RPT.source === 'STOCK' ? 'selected' : ''}>เบิกน้ำมันในสต็อก</option>
        <option value="PUMP" ${RPT.source === 'PUMP' ? 'selected' : ''}>เบิกเติมที่ปั๊ม</option>
        <option value="" ${RPT.source === '' ? 'selected' : ''}>ทั้งหมด</option></select></div>
      <div class="field"><label class="f" for="rpSt">สถานะ</label><select id="rpSt" class="input">
        <option value="DONE" ${RPT.status === 'DONE' ? 'selected' : ''}>เฉพาะที่ดำเนินการแล้ว</option>
        <option value="" ${RPT.status === '' ? 'selected' : ''}>ทุกสถานะ</option></select></div>
    </div>
    <div class="btn-row"><button class="btn primary" id="rpGo">แสดงรายงาน</button><button class="btn ghost" id="rpPrint" disabled>พิมพ์รายงาน</button></div>
  </section>
  <section class="card" id="rpOut"><div class="empty small">เลือกช่วงวันที่แล้วกด "แสดงรายงาน"</div></section>`;
  $('#rpGo').onclick = loadReport;
  $('#rpPrint').onclick = printReport;
  loadReport();
}
async function loadReport() {
  RPT.from = $('#rpFrom').value; RPT.to = $('#rpTo').value; RPT.source = $('#rpSrc').value; RPT.status = $('#rpSt').value;
  const f = { from: RPT.from, to: RPT.to, source: RPT.source };
  if (RPT.status === 'DONE') f.status = RPT.source === 'STOCK' ? ['DISPENSED'] : RPT.source === 'PUMP' ? ['APPROVED', 'RECEIVED'] : ['DISPENSED', 'APPROVED', 'RECEIVED'];
  try { RPT.data = await call('getReport', S.auth, f); } catch (e) { return; }
  $('#rpOut').innerHTML = `<div class="tbl-wrap">${reportHTML(RPT.data, false)}</div>`;
  $('#rpPrint').disabled = false;
}
function reportHTML(d, forPrint) {
  const stockMode = RPT.source === 'STOCK';
  const title = stockMode ? 'รายงานการเบิกน้ำมันเชื้อเพลิงในสต็อก' : RPT.source === 'PUMP' ? 'รายงานการเบิกน้ำมันเชื้อเพลิง (เติมที่ปั๊ม)' : 'รายงานการเบิก-จ่ายน้ำมันเชื้อเพลิง';
  const rows = d.rows;
  const sum = {}; let totalL = 0;
  rows.forEach(r => {
    if (r.status === 'REJECTED' || r.status === 'PENDING') return;
    const k = r.itemType + (r.fuelType ? ' (' + r.fuelType + ')' : '');
    sum[k] = sum[k] || { n: 0, liters: 0, baht: 0, full: 0 };
    sum[k].n++;
    const v = +(r.approvedAmount || r.amount || 0);
    if (r.source === 'STOCK' || r.amountMode === 'LITER' || r.status === 'RECEIVED') { sum[k].liters += v; if (r.source === 'STOCK') totalL += v; }
    else if (r.amountMode === 'BAHT') sum[k].baht += v; else sum[k].full++;
  });
  const logs = d.logs.filter(l => stockMode || RPT.source === '' ? true : false);
  const typeTH = { IN:'รับเข้า', OUT:'จ่ายออก', RETURN:'รับคืนขวดเปล่า', ADJUST:'ปรับยอด' };
  return `<div class="rpt">
    <h1>${esc(title)}</h1>
    <div class="sub">${esc(d.orgName || '')}<br>ระหว่างวันที่ ${thDate(RPT.from)} ถึง ${thDate(RPT.to)}</div>
    <table><thead><tr><th>ที่</th><th>วันที่ / เวลา</th><th>เลขที่</th><th>ผู้เบิก</th><th>รายการ</th>${stockMode ? '' : '<th>ทะเบียน</th><th>น้ำมัน</th>'}<th class="num">จำนวน</th>${stockMode || RPT.source === '' ? '<th>ขวดหมายเลข</th>' : ''}<th>ผู้อนุมัติ</th>${stockMode ? '<th>ผู้จ่าย</th><th class="num">คงเหลือ</th>' : ''}<th>สถานะ</th>${forPrint ? '<th>ลายมือชื่อผู้รับ</th>' : ''}</tr></thead><tbody>
    ${rows.map((r, i) => `<tr><td class="num">${i + 1}</td><td>${thDate(r.reqDate)} ${esc(r.reqTime)}</td><td>${esc(r.reqId)}</td><td>${esc(r.requesterName)}</td><td>${esc(r.itemName)}</td>
      ${stockMode ? '' : `<td>${esc(r.plate || '')}</td><td>${esc(r.fuelType)}</td>`}<td class="num">${esc(amountText(r))}</td>${stockMode || RPT.source === '' ? `<td>${esc(r.bottles || '')}</td>` : ''}
      <td>${esc(r.approverName || '')}</td>${stockMode ? `<td>${esc(r.dispenserName || '')}</td><td class="num">${esc(r.stockAfter)}</td>` : ''}<td>${esc(statusText(r))}</td>${forPrint ? '<td style="min-width:90px"></td>' : ''}</tr>`).join('')
      || `<tr><td colspan="14" style="text-align:center">ไม่มีข้อมูล</td></tr>`}
    </tbody></table>

async function boot() {

  catch (e) { $('#view').innerHTML = `<section class="card"><div class="alert bad">โหลดข้อมูลไม่สำเร็จ: ${esc(cleanErr(e))}</div><p class="small">หากเพิ่งติดตั้ง ให้เปิด Google Sheet แล้วเลือกเมนู ระบบน้ำมัน → ตั้งค่าเริ่มต้น</p></section>`; return; }
  const saved = loadAuth();
  if (saved && saved.userId) { try { S.me = await api('login', saved.userId); S.auth = { userId: saved.userId, link: true }; saveAuth(); } catch (e) { S.auth = null; saveAuth(); } }
  let p = document.body.dataset.page || '';
  if (!/^[a-z]+$/.test(p)) p = new URLSearchParams(location.search).get('page') || '';
  S.page = PAGES.some(x => x.id === p) ? p : 'bottles';
  renderShell(); go(S.page);
}
document.addEventListener('DOMContentLoaded', boot);
