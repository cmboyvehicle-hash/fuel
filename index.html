    const mk = (o) => { const it = DB.items.find(i => i.id === o.itemId), u = DB.users.find(x => x.id === o.requesterId);
      const r = Object.assign({ createdAt: ago(o.d, 8), reqDate: ago(o.d).slice(0, 10), reqTime:'08:30', requesterName:u.name, itemName:it.name, itemType:it.type, plate:it.plate, fuelType:it.fuelType, source:it.source,
        amountMode:'LITER', amount:'', approvedAmount:'', status:'PENDING', approverName:'', approvedAt:'', approveNote:'', dispenserName:'', dispensedAt:'', photoUrl:'', photoId:'', stockBefore:'', stockAfter:'', bottles:'', note:'' }, o);
      delete r.d; DB.requests.push(r); return r; };
    // ประวัติ: จ่ายแล้ว 2 ขวดให้ U02 (ขวด FB-01, FB-02 ยังไม่คืน)
    mk({ reqId:'FR-DEMO-001', d:3, requesterId:'U02', itemId:'V11', amount:2, approvedAmount:2, status:'DISPENSED', approverName:'หัวหน้าสุดา (อนุมัติสต็อก)', approvedAt:ago(3, 9), dispenserName:'มานพ (ผู้จ่ายสต็อก)', dispensedAt:ago(3, 10), stockBefore:12, stockAfter:10, bottles:'FB-01,FB-02' });
    DB.bottles[0].status = DB.bottles[1].status = 'OUT';
    [0, 1].forEach(i => Object.assign(DB.bottles[i], { holderId:'U02', holderName:'สมศักดิ์ รักงาน', reqId:'FR-DEMO-001', updatedAt:ago(3, 10) }));
    DB.logs.push({ time:ago(3, 10), type:'OUT', liters:2, before:10, after:8, bottles:'FB-01,FB-02', reqId:'FR-DEMO-001', by:'มานพ (ผู้จ่ายสต็อก)', note:'สมศักดิ์ รักงาน / เครื่องตัดหญ้า ตัวที่ 1' });
    mk({ reqId:'FR-DEMO-002', d:2, requesterId:'U01', itemId:'V02', amountMode:'FULL', status:'APPROVED', approverName:'หัวหน้าวิชัย (อนุมัติปั๊ม)', approvedAt:ago(2, 9) });
    mk({ reqId:'FR-DEMO-003', d:0, requesterId:'U02', itemId:'V10', amount:3, approvedAmount:3, status:'APPROVED', approverName:'หัวหน้าสุดา (อนุมัติสต็อก)', approvedAt:ago(0, 8) });
    mk({ reqId:'FR-DEMO-004', d:0, requesterId:'U02', itemId:'V12', amount:2, status:'PENDING' });
    mk({ reqId:'FR-DEMO-005', d:0, requesterId:'U01', itemId:'V05', amountMode:'LITER', amount:30, status:'PENDING', note:'ไปราชการต่างจังหวัด' });
  }
  seed();

  const user = id => DB.users.find(u => u.id === id);
  const active = x => x.active !== false;
  const roleUsers = role => { let t = DB.users.filter(u => active(u) && u.roles.includes(role) && u.lineUserId); if (!t.length) t = DB.users.filter(u => u.roles.includes('admin')); return t; };
  const amt = r => amountText(r);
  const base = r => [['เลขที่', r.reqId], ['วันที่', thDate(r.reqDate) + ' ' + r.reqTime + ' น.'], ['ผู้ขอเบิก', r.requesterName], ['รายการ', r.itemType + (r.plate ? ' ทะเบียน ' + r.plate : '') + ' / ' + r.itemName], ['น้ำมัน', r.fuelType], ['จำนวน', amt(r)]];
  function line(toUsers, title, color, rows, button, img) {
    const names = toUsers.map(u => u.name).join(', ');
    if (!names) return 0;
    LINE_LOG.push({ to: names, at: nowHM() + ' น.', title, color, rows, button, img });
    const c = $('#lineCnt'); if (c) c.textContent = LINE_LOG.length;
    return toUsers.length;
  }
  function auth(a, roles) {
    if (!a || !a.userId) throw new Error('กรุณาเข้าสู่ระบบ');
    const u = DB.users.find(x => x.id === a.userId && active(x));
    if (!u) throw new Error('ไม่พบชื่อผู้ใช้นี้ในระบบ');
    if (roles && !u.roles.includes('admin') && !roles.some(r => u.roles.includes(r))) throw new Error('ไม่มีสิทธิ์ใช้งานส่วนนี้');
    return u;
  }
  function stock() {
    const bottles = DB.bottles.filter(active).map(b => ({ code:b.code, status:b.status, holderId:b.holderId, holderName:b.holderName, reqId:b.reqId, updatedAt:b.updatedAt }))
      .sort((x, y) => x.code.localeCompare(y.code, 'en', { numeric: true }));
    const cnt = s => bottles.filter(b => b.status === s).length;
    const reserved = DB.requests.filter(r => r.source === 'STOCK' && (r.status === 'PENDING' || r.status === 'APPROVED')).reduce((s, r) => s + +(r.approvedAmount || r.amount || 0), 0);
    const balance = cnt('FULL');
    return { balance, reserved, available: Math.max(0, balance - reserved), empty: cnt('EMPTY'), out: cnt('OUT'), capacity: bottles.length, lowAlert: +DB.config.STOCK_LOW_ALERT, bottles };
  }
  const cfgPub = () => ({ orgName: DB.config.ORG_NAME, stockMin: +DB.config.STOCK_MIN_LITER, stockMax: +DB.config.STOCK_MAX_LITER, lowAlert: +DB.config.STOCK_LOW_ALERT, lineReady: true });
  const findReq = id => { const r = DB.requests.find(x => x.reqId === id); if (!r) throw new Error('ไม่พบคำขอ'); return r; };
  const norm = codes => [...new Set([].concat(codes || []).map(parseBottleCode).filter(Boolean))];
  const bot = c => DB.bottles.find(b => b.code === c && active(b));
  const statusTxt = b => b.status === 'FULL' ? 'ขวดเต็มอยู่ที่สต็อก' : b.status === 'EMPTY' ? 'ขวดเปล่าอยู่ที่สต็อก' : 'อยู่กับ ' + b.holderName;
  function filter(f) {
    const st = f.status ? [].concat(f.status) : null;
    let rows = DB.requests.filter(r => (!st || st.includes(r.status)) && (!f.source || r.source === f.source) && (!f.requesterId || r.requesterId === f.requesterId) && (!f.from || r.reqDate >= f.from) && (!f.to || r.reqDate <= f.to));
    rows = rows.slice().sort((x, y) => String(y.createdAt).localeCompare(String(x.createdAt)));
    return f.limit ? rows.slice(0, f.limit) : rows;
  }
  function adminData() { return { users: DB.users, items: DB.items.slice().sort((a, b) => a.order - b.order), config: cfgPub(), stock: stock() }; }
  let seq = 0;

  return {
    _seed: seed,
    getBootstrap: () => ({ config: cfgPub(), users: DB.users.filter(active).map(u => ({ id:u.id, name:u.name, position:u.position, roles:u.roles })), items: DB.items.filter(active).slice().sort((a, b) => a.order - b.order), stock: stock() }),
    login: (id, pin) => { const u = auth({ userId:id, pin }); return { id:u.id, name:u.name, position:u.position, roles:u.roles }; },
    getStock: stock,
    createRequest(p) {
      const u = user(p.requesterId), it = DB.items.find(i => i.id === p.itemId);
      if (!u) throw new Error('ไม่พบชื่อผู้เบิก'); if (!it) throw new Error('ไม่พบรายการ');
      let mode = p.amountMode || 'FULL', amount = p.amount;
      if (it.source === 'STOCK') { mode = 'LITER'; amount = +p.amount; const s = stock(); if (amount > s.available) throw new Error('น้ำมันในสต็อกไม่พอ (ให้เบิกได้ ' + s.available + ' ลิตร)'); }
      else if (mode === 'FULL') amount = '';
      const r = { reqId: 'FR' + todayISO().slice(2).replace(/-/g, '') + '-' + pad(++seq).padStart(3, '0'), createdAt: now(), reqDate:p.reqDate, reqTime:p.reqTime, requesterId:u.id, requesterName:u.name,
        itemId:it.id, itemName:it.name, itemType:it.type, plate:it.plate, fuelType:it.fuelType, source:it.source, amountMode:mode, amount, approvedAmount:'', status:'PENDING',
        approverName:'', approvedAt:'', approveNote:'', dispenserName:'', dispensedAt:'', photoUrl:'', photoId:'', stockBefore:'', stockAfter:'', bottles:'', note:p.note || '' };
      DB.requests.push(r);
      const pump = it.source === 'PUMP';
      const n = line(roleUsers(pump ? 'approver_pump' : 'approver_stock'), pump ? 'คำขอเบิกน้ำมัน (เติมที่ปั๊ม)' : 'คำขอเบิกน้ำมันจากสต็อก', pump ? '#1565C0' : '#E65100', base(r), 'เปิดหน้าอนุมัติ');
      return { ok:true, reqId:r.reqId, lineSent:n, stock:stock() };
    },
    approvePump(a, id, decision, opt) {
      const u = auth(a, ['approver_pump']), r = findReq(id);
      if (r.source !== 'PUMP' || r.status !== 'PENDING') throw new Error('รายการนี้ถูกดำเนินการไปแล้ว');
      Object.assign(r, { approverName:u.name, approvedAt:now(), approveNote:opt.note || '' });
      if (decision === 'approve') {
        r.amountMode = opt.amountMode; r.approvedAmount = opt.amountMode === 'FULL' ? '' : +opt.amount; r.status = 'APPROVED';
        line([user(r.requesterId)], 'อนุมัติแล้ว - กรุณามารับเอกสาร', '#2E7D32', base(r).concat([['ผู้อนุมัติ', u.name], ['แจ้ง', 'กรุณามารับเอกสารใบเบิกน้ำมัน เพื่อนำไปดำเนินการเติมที่ปั๊ม']]));
        if (r.itemType === 'เติมสต็อก') line(roleUsers('dispenser'), 'อนุมัติเบิกเติมสต็อกแล้ว', '#6A1B9A', base(r).concat([['แจ้ง', 'เมื่อได้รับน้ำมันแล้ว กรุณาบันทึกรับเข้าสต็อก']]), 'บันทึกรับเข้าสต็อก');
      } else { r.status = 'REJECTED'; line([user(r.requesterId)], 'ไม่อนุมัติคำขอเบิกน้ำมัน', '#C62828', base(r).concat([['เหตุผล', r.approveNote]])); }
      return { ok:true, status:r.status };
    },
    approveStock(a, id, decision, liters, note, dispenserId) {
      const u = auth(a, ['approver_stock']), r = findReq(id);
      const tg = dispenserId ? DB.users.find(x => x.id === dispenserId) : null;
      if (r.source !== 'STOCK' || r.status !== 'PENDING') throw new Error('รายการนี้ถูกดำเนินการไปแล้ว');
      Object.assign(r, { approverName:u.name, approvedAt:now(), approveNote:note || '' });
      if (decision === 'approve') {
        const s = stock(); if (+liters > s.available + +r.amount) throw new Error('สต็อกไม่พอ');
        r.approvedAmount = +liters; r.status = 'APPROVED';
        if (tg) { r.assignedId = tg.id; r.assignedName = tg.name; }
        line(tg ? [tg] : roleUsers('dispenser'), 'อนุมัติเบิกจากสต็อก - รอจ่ายน้ำมัน', '#E65100', base(r).concat([['จำนวนที่อนุมัติ', liters + ' ลิตร'], ['ผู้อนุมัติ', u.name]]).concat(tg ? [['ผู้จ่ายที่รับผิดชอบ', tg.name]] : []), 'รับเรื่อง / จ่ายน้ำมัน');
        return { ok:true, status:r.status, sentTo: tg ? tg.name : 'ผู้จ่ายสต็อกทุกคน', stock:stock() };
      } else { r.status = 'REJECTED'; line([user(r.requesterId)], 'ไม่อนุมัติคำขอเบิกจากสต็อก', '#C62828', base(r).concat([['เหตุผล', r.approveNote]])); }
      return { ok:true, status:r.status, stock:stock() };
    },
    dispense(a, id, photo, codes, note) {
      const u = auth(a, ['dispenser']), r = findReq(id);
      if (!photo || !photo.data) throw new Error('กรุณาแนบรูป');
      if (r.status !== 'APPROVED' || r.source !== 'STOCK') throw new Error('รายการนี้ไม่อยู่ในสถานะรอจ่าย');
      codes = norm(codes); const need = +r.approvedAmount;
      if (codes.length !== need) throw new Error('ต้องสแกนขวด ' + need + ' ขวด (สแกนแล้ว ' + codes.length + ')');
      codes.forEach(c => { const b = bot(c); if (!b) throw new Error('ไม่พบขวด ' + c); if (b.status !== 'FULL') throw new Error('ขวด ' + c + ' ไม่ใช่ขวดเต็มในสต็อก (' + statusTxt(b) + ')'); });
      const before = stock().balance, t = now(), img = 'data:image/jpeg;base64,' + photo.data;
      codes.forEach(c => Object.assign(bot(c), { status:'OUT', holderId:r.requesterId, holderName:r.requesterName, reqId:r.reqId, updatedAt:t }));
      Object.assign(r, { status:'DISPENSED', dispenserName:u.name, dispensedAt:t, photoUrl:img, stockBefore:before, stockAfter:before - need, bottles:codes.join(',') });
      DB.logs.push({ time:t, type:'OUT', liters:need, before, after:before - need, bottles:r.bottles, reqId:r.reqId, by:u.name, note:r.requesterName + ' / ' + r.itemName });
      line([user(r.requesterId)], 'จ่ายน้ำมันจากสต็อกเรียบร้อย', '#2E7D32', base(r).concat([['ขวดหมายเลข', r.bottles], ['ผู้จ่าย', u.name], ['คงเหลือในสต็อก', r.stockAfter + ' ขวด'], ['แจ้ง', 'ใช้เสร็จแล้วกรุณานำขวดเปล่ามาคืนที่สต็อก']]), null, img);
      if (r.stockAfter <= +DB.config.STOCK_LOW_ALERT) line(roleUsers('approver_pump').concat(roleUsers('dispenser')), 'แจ้งเตือน: น้ำมันในสต็อกใกล้หมด', '#C62828', [['ขวดเต็มคงเหลือ', r.stockAfter + ' ขวด']], 'เปิดระบบ');
      return { ok:true, photoUrl:img, stock:stock() };
    },
    returnBottles(a, codes) {
      const u = auth(a, ['dispenser']); codes = norm(codes);
      codes.forEach(c => { const b = bot(c); if (!b) throw new Error('ไม่พบขวด ' + c); if (b.status !== 'OUT') throw new Error('ขวด ' + c + ' ไม่ได้อยู่กับผู้เบิก'); });
      const full = stock().balance, t = now(), from = [...new Set(codes.map(c => bot(c).holderName))];
      codes.forEach(c => Object.assign(bot(c), { status:'EMPTY', holderId:'', holderName:'', reqId:'', updatedAt:t }));
      DB.logs.push({ time:t, type:'RETURN', liters:0, before:full, after:full, bottles:codes.join(','), reqId:'', by:u.name, note:'รับคืนขวดเปล่าจาก ' + from.join(', ') });
      return { ok:true, stock:stock() };
    },
    receiveStock(a, reqId, codes, note) {
      const u = auth(a, ['dispenser']); codes = norm(codes);
      codes.forEach(c => { const b = bot(c); if (!b) throw new Error('ไม่พบขวด ' + c); if (b.status !== 'EMPTY') throw new Error('ขวด ' + c + ' ไม่ใช่ขวดเปล่าที่สต็อก'); });
      const before = stock().balance, t = now();
      codes.forEach(c => Object.assign(bot(c), { status:'FULL', updatedAt:t }));
      DB.logs.push({ time:t, type:'IN', liters:codes.length, before, after:before + codes.length, bottles:codes.join(','), reqId:reqId || '', by:u.name, note:note || '' });
      if (reqId) { const r = findReq(reqId); Object.assign(r, { status:'RECEIVED', dispenserName:u.name, dispensedAt:t, approvedAmount:codes.length, stockBefore:before, stockAfter:before + codes.length, bottles:codes.join(',') });
        line([user(r.requesterId)], 'รับน้ำมันเข้าสต็อกแล้ว', '#2E7D32', [['คำขอ', r.reqId], ['จำนวน', codes.length + ' ลิตร'], ['ขวด', r.bottles]]); }
      return { ok:true, stock:stock() };
    },
    notifyRefill(uid, note) {
      const u = user(uid), s = stock();
      const n = line(roleUsers('approver_pump').concat(roleUsers('dispenser')), 'แจ้งขอให้เติมน้ำมันเข้าสต็อก', '#6A1B9A', [['แจ้งโดย', u ? u.name : '-'], ['ขวดเต็มคงเหลือ', s.balance + ' ขวด'], ['ให้เบิกได้', s.available + ' ลิตร'], ['หมายเหตุ', note || '-']], 'เปิดระบบ');
      return { ok:true, lineSent:n };
    },
    listRequests: (a, f) => { auth(a); return filter(f || {}); },
    listMyRequests: id => filter({ requesterId:id, limit:20 }),
    getReport(a, f) { auth(a); return { rows: filter(f).reverse(), logs: DB.logs.filter(l => (!f.from || l.time.slice(0, 10) >= f.from) && (!f.to || l.time.slice(0, 10) <= f.to)), orgName: DB.config.ORG_NAME, generatedAt: now(), stock: stock() }; },
    getAdminData: a => { auth(a, ['admin']); return adminData(); },
    saveItems(a, list) { auth(a, ['admin']); DB.items = list.map((it, i) => Object.assign({}, it, { id: it.id || 'V' + Date.now() + i, order: +it.order || i + 1 })); return adminData(); },
    saveUsers(a, list) { auth(a, ['admin']);
      DB.users = list.map((u, i) => Object.assign({}, u, { id: u.id || 'U' + Date.now() + i, roles: u.roles.length ? u.roles : ['requester'] })); return adminData(); },
    saveConfig(a, c) { auth(a, ['admin']); DB.config.ORG_NAME = c.orgName; DB.config.STOCK_LOW_ALERT = +c.lowAlert; DB.config.STOCK_MIN_LITER = +c.stockMin; DB.config.STOCK_MAX_LITER = +c.stockMax; return adminData(); },
    addBottles(a, n, st) { auth(a, ['admin']); let max = Math.max(0, ...DB.bottles.map(b => +b.code.replace(/\D/g, '')));
      for (let i = 1; i <= n; i++) DB.bottles.push({ code:'FB-' + pad(max + i), status:st, holderId:'', holderName:'', reqId:'', updatedAt:now(), active:true }); return adminData(); },
    saveBottles(a, list) { auth(a, ['admin']);
      list.forEach(b => { const x = DB.bottles.find(y => y.code === b.code); const h = user(b.holderId);
        if (b.status === 'OUT' && !h) throw new Error('ขวด ' + b.code + ' ต้องเลือกผู้ถือขวด');
        Object.assign(x, { status:b.status, holderId: b.status === 'OUT' ? h.id : '', holderName: b.status === 'OUT' ? h.name : '', active:b.active }); });
      return adminData(); }
  };
})();
</script>
</body>
